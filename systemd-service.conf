# Configuración de servicio systemd para CRM WhatsApp
# Ubicación: /etc/systemd/system/crm-whatsapp.service

[Unit]
Description=CRM WhatsApp AI - Sistema de gestión de clientes con IA
Documentation=https://github.com/tu-usuario/crm-whatsapp-ai
After=network.target postgresql.service
Wants=network.target
Requires=postgresql.service

[Service]
Type=simple
User=www-data
Group=www-data
WorkingDirectory=/opt/crm-whatsapp-ai
Environment=NODE_ENV=production
Environment=PORT=5000
ExecStart=/usr/bin/npm run dev
ExecReload=/bin/kill -HUP $MAINPID
KillMode=mixed
KillSignal=SIGINT
TimeoutStopSec=30
Restart=always
RestartSec=10
RestartPreventExitStatus=23

# Configuración de recursos
LimitNOFILE=65536
LimitNPROC=32768

# Configuración de seguridad
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=yes
ReadWritePaths=/opt/crm-whatsapp-ai

# Configuración de logging
StandardOutput=journal
StandardError=journal
SyslogIdentifier=crm-whatsapp

[Install]
WantedBy=multi-user.target